<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประเมินราคารับจ้างเรียน ED</title>
    <!-- ใช้ Tailwind CSS เพื่อความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 flex items-center justify-center">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-blue-600 text-white p-6 text-center">
            <h1 class="text-2xl font-semibold mb-2">บริการรับเก็บชั่วโมงเรียน</h1>
            <p class="text-sm opacity-90">ประเมินราคาและส่งข้อมูลให้เราได้ทันที</p>
        </div>
        
        <div class="p-6">
            <form id="orderForm" class="space-y-4">
                <!-- ข้อมูลลูกค้า -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ / ช่องทางติดต่อ (Line ID)</label>
                    <input type="text" id="contactInfo" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="เช่น สมชาย ID Line: xxxx">
                </div>

                <!-- เลเวล (สามารถปรับแก้ราคาด้านล่างตรง data-hr และ data-ch ได้) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ระดับความยาก (Level)</label>
                    <select id="level" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <!-- data-hr = ราคาต่อชั่วโมง, data-ch = ราคาต่อบท -->
                        <option value="1" data-hr="50" data-ch="100">Level 1 (เริ่มต้น)</option>
                        <option value="2" data-hr="70" data-ch="150">Level 2 (ปานกลาง)</option>
                        <option value="3" data-hr="100" data-ch="200">Level 3 (ขั้นสูง)</option>
                    </select>
                </div>

                <!-- จำนวนชั่วโมงและบท -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนชั่วโมง</label>
                        <input type="number" id="hours" min="0" value="0" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนบท</label>
                        <input type="number" id="chapters" min="0" value="0" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <!-- ราคาประเมิน -->
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mt-6 text-center">
                    <p class="text-sm text-gray-600 mb-1">ราคาประเมินเบื้องต้น</p>
                    <div class="text-3xl font-bold text-blue-700"><span id="totalPrice">0</span> ฿</div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition duration-200 mt-4">
                    ตกลงและส่งข้อมูล
                </button>
            </form>
        </div>
    </div>

    <script>
        // ส่วนของการคำนวณและการทำงาน
        const levelSelect = document.getElementById('level');
        const hoursInput = document.getElementById('hours');
        const chaptersInput = document.getElementById('chapters');
        const totalPriceEl = document.getElementById('totalPrice');
        const orderForm = document.getElementById('orderForm');
        const contactInfo = document.getElementById('contactInfo');

        function calculatePrice() {
            // ดึงราคาที่ซ่อนไว้ใน option
            const selectedOption = levelSelect.options[levelSelect.selectedIndex];
            const ratePerHour = parseInt(selectedOption.getAttribute('data-hr'));
            const ratePerChapter = parseInt(selectedOption.getAttribute('data-ch'));
            
            const hours = parseInt(hoursInput.value) || 0;
            const chapters = parseInt(chaptersInput.value) || 0;

            // สูตรคำนวณ: (ชั่วโมง * เรทชั่วโมง) + (บท * เรทบท)
            const total = (hours * ratePerHour) + (chapters * ratePerChapter);
            totalPriceEl.textContent = total.toLocaleString();
        }

        // เมื่อมีการเปลี่ยนเลเวล จำนวนชั่วโมง หรือจำนวนบท ให้คำนวณใหม่ทันที
        levelSelect.addEventListener('change', calculatePrice);
        hoursInput.addEventListener('input', calculatePrice);
        chaptersInput.addEventListener('input', calculatePrice);

        // เมื่อกดปุ่มส่งข้อมูล
        orderForm.addEventListener('submit', function(e) {
            e.preventDefault(); // ป้องกันเว็บรีเฟรช
            const total = totalPriceEl.textContent;
            const levelText = levelSelect.options[levelSelect.selectedIndex].text;
            
            const summary = `มีลูกค้าส่งข้อมูลมาจ้า!\n` +
                            `ติดต่อ: ${contactInfo.value}\n` +
                            `ระดับ: ${levelText}\n` +
                            `ชั่วโมง: ${hoursInput.value} ชม.\n` +
                            `จำนวนบท: ${chaptersInput.value} บท\n` +
                            `ราคาประเมิน: ${total} บาท`;
            
            // แสดงข้อมูลขึ้นมาให้ดูเบื้องต้น
            alert("ระบบจำลองการเตรียมข้อมูลส่งหาคุณ:\n\n" + summary);
            
            // **คำแนะนำเพิ่มเติมสำหรับการใช้งานจริง:**
            // คุณสามารถนำข้อมูล summary นี้ไปเขียนต่อยอดให้ส่งเข้า LINE Notify 
            // เพื่อเด้งเตือนในมือถือของคุณทันทีที่ลูกค้ากดปุ่มส่งข้อมูลได้
        });
    </script>
</body>
</html>
